<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mouse — Precision Engineered</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: auto;
    }

    body {
      background: #0a0a0f;
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* ── Scroll spacer — determines how long the animation plays ── */
    #scroll-spacer {
      height: 500vh;
    }

    /* ── Sticky canvas container ── */
    #canvas-wrap {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      z-index: 1;
    }

    #canvas-wrap canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* ── Gradient overlay behind text ── */
    #hero-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(99, 51, 255, 0.18) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(0, 180, 255, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 2;
    }

    /* ── Hero text ── */
    #hero {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 3;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #hero h1 {
      font-size: clamp(2.4rem, 7vw, 6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
      background: linear-gradient(135deg, #ffffff 0%, #a78bfa 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #hero p {
      margin-top: 1.2rem;
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ── Scroll hint ── */
    #scroll-hint {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #scroll-hint span {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }

    #scroll-hint .arrow {
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.4), transparent);
      animation: scrollArrow 1.6s ease-in-out infinite;
    }

    @keyframes scrollArrow {
      0%, 100% { transform: scaleY(1); opacity: 1; }
      50% { transform: scaleY(0.5); opacity: 0.4; }
    }

    /* ── Progress bar ── */
    #progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, #7c3aed, #38bdf8);
      z-index: 100;
      transition: width 0.05s linear;
    }

    /* ── Content section below ── */
    #below {
      position: relative;
      z-index: 5;
      background: #0a0a0f;
      padding: 8rem 2rem;
      text-align: center;
    }

    #below h2 {
      font-size: clamp(1.6rem, 4vw, 3rem);
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 1.5rem;
    }

    #below p {
      max-width: 560px;
      margin: 0 auto;
      color: rgba(255,255,255,0.45);
      line-height: 1.8;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div id="progress"></div>

  <!-- The sticky animation stage -->
  <div id="scroll-spacer">
    <div id="canvas-wrap">
      <div id="hero-overlay"></div>
      <div id="hero">
        <h1>Engineered<br>for Precision</h1>
        <p>Scroll to explore</p>
      </div>
      <div id="scroll-hint">
        <span>Scroll</span>
        <div class="arrow"></div>
      </div>
    </div>
  </div>

  <!-- Content revealed after animation -->
  <section id="below">
    <h2>Every detail. Considered.</h2>
    <p>From the arc of the shell to the weight of the scroll wheel, every component is refined to feel like an extension of your hand.</p>
  </section>

  <!-- Three.js from CDN -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ── DOM refs ──────────────────────────────────────────────
    const wrap        = document.getElementById('canvas-wrap');
    const hero        = document.getElementById('hero');
    const scrollHint  = document.getElementById('scroll-hint');
    const progressBar = document.getElementById('progress');
    const spacer      = document.getElementById('scroll-spacer');

    // ── Three.js setup ────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    wrap.appendChild(renderer.domElement);

    const scene  = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    // Fullscreen quad geometry
    const geo      = new THREE.PlaneGeometry(2, 2);
    const videoTex = new THREE.VideoTexture(videoEl());
    videoTex.minFilter = THREE.LinearFilter;
    videoTex.magFilter = THREE.LinearFilter;

    const mat  = new THREE.MeshBasicMaterial({ map: videoTex, transparent: true });
    const mesh = new THREE.Mesh(geo, mat);
    scene.add(mesh);

    // ── Video element ─────────────────────────────────────────
    function videoEl() {
      const v = document.createElement('video');
      v.src = 'Mouse_rotation_exploded_202604202134.mp4';
      v.muted = true;
      v.playsInline = true;
      v.preload = 'auto';
      // Load but don't auto-play; we'll seek manually
      v.load();
      return v;
    }
    const video = mat.map.image; // reference back to the video element

    // Wait for video metadata so duration is known
    let duration = 0;
    video.addEventListener('loadedmetadata', () => {
      duration = video.duration;
    });

    // ── Scroll → frame scrubbing ──────────────────────────────
    let targetTime = 0;
    let currentTime = 0;

    function getScrollProgress() {
      const scrollTop = window.scrollY;
      const maxScroll = spacer.offsetHeight - window.innerHeight;
      return Math.max(0, Math.min(1, scrollTop / maxScroll));
    }

    window.addEventListener('scroll', () => {
      const p = getScrollProgress();
      targetTime = p * duration;
      progressBar.style.width = (p * 100) + '%';

      // Hide scroll hint after first scroll
      if (p > 0.02) {
        scrollHint.style.opacity = '0';
      } else {
        scrollHint.style.opacity = '1';
      }

      // Fade hero text as animation progresses
      hero.style.opacity = p < 0.15 ? 1 : Math.max(0, 1 - (p - 0.15) / 0.15);
    }, { passive: true });

    // ── Smooth time interpolation + render loop ───────────────
    const LERP = 0.12; // smoothing factor

    function lerp(a, b, t) { return a + (b - a) * t; }

    function render() {
      requestAnimationFrame(render);

      if (duration > 0) {
        currentTime = lerp(currentTime, targetTime, LERP);

        // Only seek when meaningfully different (avoids thrashing)
        if (Math.abs(video.currentTime - currentTime) > 0.01) {
          video.currentTime = currentTime;
        }
      }

      videoTex.needsUpdate = true;
      renderer.render(scene, camera);
    }

    render();

    // ── Resize handler ────────────────────────────────────────
    window.addEventListener('resize', () => {
      renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    });
  </script>

</body>
</html>
