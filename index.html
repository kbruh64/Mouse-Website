<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mouse — Precision Engineered</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: auto; }

    body {
      background: #05050d;
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      cursor: none;
    }

    /* ── Scroll architecture ── */
    #scroll-spacer { height: 500vh; }

    #canvas-wrap {
      position: sticky;
      top: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #canvas-wrap canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    /* ── Ambient gradient ── */
    #ambient {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 55% at 50% -5%,  rgba(120,60,255,0.13) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% 110%, rgba(0,200,255,0.09) 0%, transparent 70%);
    }

    /* ── Hero ── */
    #hero {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 5;
      pointer-events: none;
      will-change: opacity, transform;
    }

    #hero h1 {
      font-size: clamp(2.8rem, 7.5vw, 7rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.04;
      background: linear-gradient(130deg, #fff 0%, #c4b5fd 40%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #hero .sub {
      margin-top: 1.4rem;
      font-size: clamp(0.7rem, 1.4vw, 0.9rem);
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    /* ── Scroll hint ── */
    #scroll-hint {
      position: absolute;
      bottom: 2.8rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      pointer-events: none;
      will-change: opacity;
      transition: opacity 0.5s;
    }
    #scroll-hint span {
      font-size: 0.62rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }
    #scroll-hint .line {
      width: 1px;
      height: 46px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.3), transparent);
      animation: lineAnim 2s ease-in-out infinite;
    }
    @keyframes lineAnim {
      0%,100% { opacity:1; transform:scaleY(1); }
      50%      { opacity:0.2; transform:scaleY(0.5); }
    }

    /* ── Progress bar ── */
    #progress {
      position: fixed;
      top: 0; left: 0;
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, #7c3aed, #38bdf8);
      z-index: 200;
      pointer-events: none;
    }

    /* ── Custom cursor ── */
    #cur-dot {
      position: fixed;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(200,170,255,0.9);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%,-50%);
      mix-blend-mode: screen;
    }
    #cur-ring {
      position: fixed;
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(180,140,255,0.35);
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%,-50%);
      mix-blend-mode: screen;
      transition: width 0.2s, height 0.2s, border-color 0.2s;
    }
    body.clicking #cur-ring {
      width: 60px; height: 60px;
      border-color: rgba(180,140,255,0.7);
    }

    /* ── Below section ── */
    #below {
      position: relative;
      z-index: 5;
      background: #05050d;
      padding: 10rem 2rem;
      text-align: center;
    }
    #below h2 {
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 1.6rem;
      letter-spacing: -0.02em;
    }
    #below p {
      max-width: 540px;
      margin: 0 auto;
      color: rgba(255,255,255,0.38);
      line-height: 1.9;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div id="progress"></div>
  <div id="cur-dot"></div>
  <div id="cur-ring"></div>

  <div id="scroll-spacer">
    <div id="canvas-wrap">
      <div id="ambient"></div>
      <div id="hero">
        <h1>Engineered<br>for Precision</h1>
        <p class="sub">Scroll to explore</p>
      </div>
      <div id="scroll-hint">
        <span>Scroll</span>
        <div class="line"></div>
      </div>
    </div>
  </div>

  <section id="below">
    <h2>Every detail. Considered.</h2>
    <p>From the arc of the shell to the weight of the scroll wheel, every component is refined to feel like an extension of your hand.</p>
  </section>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass }       from 'three/addons/postprocessing/ShaderPass.js';

    // ─────────────────────────────────────────────────────────────────────────
    //  DOM
    // ─────────────────────────────────────────────────────────────────────────
    const wrap        = document.getElementById('canvas-wrap');
    const hero        = document.getElementById('hero');
    const scrollHint  = document.getElementById('scroll-hint');
    const progressBar = document.getElementById('progress');
    const spacer      = document.getElementById('scroll-spacer');
    const curDot      = document.getElementById('cur-dot');
    const curRing     = document.getElementById('cur-ring');

    // ─────────────────────────────────────────────────────────────────────────
    //  Renderer
    // ─────────────────────────────────────────────────────────────────────────
    const W = () => wrap.clientWidth;
    const H = () => wrap.clientHeight;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W(), H());
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    wrap.appendChild(renderer.domElement);

    // ─────────────────────────────────────────────────────────────────────────
    //  Scene + Camera
    // ─────────────────────────────────────────────────────────────────────────
    const scene  = new THREE.Scene();
    scene.background = new THREE.Color(0x05050d);

    const FOV    = 50;
    const camera = new THREE.PerspectiveCamera(FOV, W() / H(), 0.01, 100);
    camera.position.z = 2.4;

    // Compute plane dimensions that fill screen height at z=0
    function frustumHeight(dist) {
      return 2 * Math.tan((FOV / 2) * Math.PI / 180) * dist;
    }

    // ─────────────────────────────────────────────────────────────────────────
    //  Video
    // ─────────────────────────────────────────────────────────────────────────
    const video = document.createElement('video');
    video.src         = 'Mouse_rotation_exploded_202604202134.mp4';
    video.muted       = true;
    video.playsInline = true;
    video.preload     = 'auto';
    video.load();

    const videoTex = new THREE.VideoTexture(video);
    videoTex.colorSpace      = THREE.SRGBColorSpace;
    videoTex.minFilter       = THREE.LinearFilter;
    videoTex.magFilter       = THREE.LinearFilter;
    videoTex.generateMipmaps = false;

    // Video shader — colour correct + vignette + luma-key alpha (makes near-black transparent)
    const videoMat = new THREE.ShaderMaterial({
      uniforms: {
        uTex:        { value: videoTex },
        uExposure:   { value: 1.08 },
        uSaturation: { value: 1.22 },
        uVignette:   { value: 0.42 },
        uLumaKey:    { value: 0.05 },  // alpha-out pixels darker than this
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D uTex;
        uniform float uExposure;
        uniform float uSaturation;
        uniform float uVignette;
        uniform float uLumaKey;
        varying vec2 vUv;

        vec3 saturate(vec3 c, float s) {
          float l = dot(c, vec3(0.2126,0.7152,0.0722));
          return mix(vec3(l), c, s);
        }

        void main() {
          vec4 c = texture2D(uTex, vUv);
          c.rgb *= uExposure;
          c.rgb  = saturate(c.rgb, uSaturation);

          // Vignette
          vec2 uv2 = vUv * 2.0 - 1.0;
          c.rgb *= clamp(1.0 - uVignette * dot(uv2,uv2), 0.0, 1.0);

          // Luma key — fade near-black to transparent (reveals particles behind)
          float luma = dot(c.rgb, vec3(0.299,0.587,0.114));
          float alpha = smoothstep(uLumaKey, uLumaKey + 0.12, luma);

          gl_FragColor = vec4(c.rgb, alpha);
        }
      `,
      transparent: true,
      depthWrite:  false,
    });

    const planeH = frustumHeight(camera.position.z) * 0.92;
    const planeW = planeH * (16 / 9);
    const videoGeo  = new THREE.PlaneGeometry(planeW, planeH);
    const videoMesh = new THREE.Mesh(videoGeo, videoMat);
    videoMesh.position.z = 0;
    scene.add(videoMesh);

    let videoDuration = 0;
    video.addEventListener('loadedmetadata', () => { videoDuration = video.duration; });

    // ─────────────────────────────────────────────────────────────────────────
    //  Particles
    // ─────────────────────────────────────────────────────────────────────────
    const N      = 4200;
    const pos    = new Float32Array(N * 3);
    const rest   = new Float32Array(N * 3);
    const vel    = new Float32Array(N * 3);
    const aColor = new Float32Array(N * 3);
    const aSize  = new Float32Array(N);

    for (let i = 0; i < N; i++) {
      const i3 = i * 3;

      // Distribute in a flattened sphere with some spread past the edges
      const angle  = Math.random() * Math.PI * 2;
      const radius = Math.pow(Math.random(), 0.45) * 5.5;
      const x = radius * Math.cos(angle);
      const y = radius * Math.sin(angle) * 0.55;
      const z = (Math.random() - 0.5) * 2.8;

      pos[i3]  = rest[i3]  = x;
      pos[i3+1] = rest[i3+1] = y;
      pos[i3+2] = rest[i3+2] = z;

      // Palette: vivid purple / ice blue / dim white
      const t = Math.random();
      if (t < 0.38) {           // purple
        aColor[i3]   = 0.50 + Math.random() * 0.35;
        aColor[i3+1] = 0.15 + Math.random() * 0.20;
        aColor[i3+2] = 0.90 + Math.random() * 0.10;
      } else if (t < 0.70) {   // cyan-blue
        aColor[i3]   = 0.05 + Math.random() * 0.20;
        aColor[i3+1] = 0.55 + Math.random() * 0.35;
        aColor[i3+2] = 0.90 + Math.random() * 0.10;
      } else {                  // white/silver
        const v = 0.65 + Math.random() * 0.35;
        aColor[i3] = aColor[i3+1] = aColor[i3+2] = v;
      }

      aSize[i] = 1.2 + Math.random() * 3.0;
    }

    const pGeo = new THREE.BufferGeometry();
    const posAttr = new THREE.BufferAttribute(pos, 3);
    posAttr.setUsage(THREE.DynamicDrawUsage);
    pGeo.setAttribute('position', posAttr);
    pGeo.setAttribute('aColor',  new THREE.BufferAttribute(aColor, 3));
    pGeo.setAttribute('aSize',   new THREE.BufferAttribute(aSize, 1));

    const pMat = new THREE.ShaderMaterial({
      uniforms: {
        uPR: { value: renderer.getPixelRatio() },
      },
      vertexShader: `
        attribute float aSize;
        attribute vec3  aColor;
        varying   vec3  vCol;
        varying   float vAlpha;
        uniform   float uPR;
        void main() {
          vCol = aColor;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          float perspective = 260.0 / -mv.z;
          gl_PointSize = aSize * uPR * perspective;
          vAlpha = clamp((-mv.z - 0.2) / 3.0, 0.1, 1.0); // depth fade
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        varying vec3  vCol;
        varying float vAlpha;
        void main() {
          float d = length(gl_PointCoord - 0.5) * 2.0;
          float a = 1.0 - smoothstep(0.2, 1.0, d);
          if (a < 0.02) discard;
          gl_FragColor = vec4(vCol, a * vAlpha);
        }
      `,
      transparent: true,
      depthWrite:  false,
      blending:    THREE.AdditiveBlending,
    });

    const particles = new THREE.Points(pGeo, pMat);
    scene.add(particles);

    // ─────────────────────────────────────────────────────────────────────────
    //  Post-processing
    // ─────────────────────────────────────────────────────────────────────────
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloom = new UnrealBloomPass(
      new THREE.Vector2(W(), H()),
      /*strength*/ 0.75,
      /*radius*/   0.55,
      /*threshold*/0.18
    );
    composer.addPass(bloom);

    // Chromatic aberration (reactive to clicks / velocity)
    const chromaShader = {
      uniforms: { tDiffuse: { value: null }, uStr: { value: 0.0 } },
      vertexShader: `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uStr;
        varying vec2 vUv;
        void main() {
          vec2 off = (vUv - 0.5) * uStr;
          float r = texture2D(tDiffuse, vUv + off).r;
          float g = texture2D(tDiffuse, vUv).g;
          float b = texture2D(tDiffuse, vUv - off).b;
          gl_FragColor = vec4(r, g, b, 1.0);
        }
      `,
    };
    const chromaPass = new ShaderPass(chromaShader);
    composer.addPass(chromaPass);

    // ─────────────────────────────────────────────────────────────────────────
    //  State
    // ─────────────────────────────────────────────────────────────────────────

    // Scroll
    let scrollP    = 0;
    let targetTime = 0;
    let smoothTime = 0;
    let lastSeek   = -1;

    // Mouse world position
    const mouseWorld = new THREE.Vector3(0, 0, 0);
    const _ndc       = new THREE.Vector3();
    const _dir       = new THREE.Vector3();
    let rawMouseX = 0, rawMouseY = 0;

    // Tilt (smooth)
    let tiltTargX = 0, tiltTargY = 0;
    let tiltX = 0, tiltY = 0;

    // Cursor DOM smooth position
    let cRingX = 0, cRingY = 0;

    // Chromatic aberration state
    let chromaStr    = 0;
    let chromaTarget = 0;

    // Ripple explosions
    let ripples = [];

    // ─────────────────────────────────────────────────────────────────────────
    //  Event listeners
    // ─────────────────────────────────────────────────────────────────────────

    // Scroll → video scrub
    window.addEventListener('scroll', () => {
      const max = spacer.offsetHeight - window.innerHeight;
      scrollP    = Math.max(0, Math.min(1, window.scrollY / max));
      targetTime = scrollP * videoDuration;
      progressBar.style.width = (scrollP * 100) + '%';
    }, { passive: true });

    // Mouse move — compute 3-D world position at z = 0 plane
    function unprojectMouse(cx, cy) {
      const rect = renderer.domElement.getBoundingClientRect();
      const nx   = ((cx - rect.left)  / rect.width)  * 2 - 1;
      const ny   = -((cy - rect.top) / rect.height) * 2 + 1;
      _ndc.set(nx, ny, 0.5).unproject(camera);
      _dir.copy(_ndc).sub(camera.position).normalize();
      const t = (0 - camera.position.z) / _dir.z;
      mouseWorld.copy(camera.position).addScaledVector(_dir, t);
      // tilt: -1..1 normalised
      tiltTargX =  nx;
      tiltTargY =  ny;
    }

    document.addEventListener('mousemove', (e) => {
      rawMouseX = e.clientX;
      rawMouseY = e.clientY;
      unprojectMouse(e.clientX, e.clientY);
    });

    // Click → ripple explosion + chroma spike
    wrap.addEventListener('click', (e) => {
      const mw = mouseWorld.clone();
      ripples.push({ x: mw.x, y: mw.y, t: 0, str: 0.18 });
      chromaTarget = 0.020;
      setTimeout(() => { chromaTarget = 0; }, 500);
    });

    document.addEventListener('mousedown', () => document.body.classList.add('clicking'));
    document.addEventListener('mouseup',   () => document.body.classList.remove('clicking'));

    // ─────────────────────────────────────────────────────────────────────────
    //  Helpers
    // ─────────────────────────────────────────────────────────────────────────
    function lerp(a, b, t) { return a + (b - a) * t; }

    // Physics constants
    const SPRING     = 0.022;
    const DAMPING    = 0.85;
    const REPEL_R    = 1.35;
    const REPEL_STR  = 0.11;

    // ─────────────────────────────────────────────────────────────────────────
    //  Physics update
    // ─────────────────────────────────────────────────────────────────────────
    const mx = mouseWorld;

    function updatePhysics() {
      const mwx = mx.x, mwy = mx.y;

      // Process ripples
      for (let r = ripples.length - 1; r >= 0; r--) {
        const rip = ripples[r];
        rip.t += 0.035;
        if (rip.t >= 1) { ripples.splice(r, 1); continue; }
        const ripRadius = rip.t * 4.5;
        const decay     = Math.pow(1 - rip.t, 1.2);

        for (let i = 0; i < N; i++) {
          const i3 = i * 3;
          const dx = pos[i3]   - rip.x;
          const dy = pos[i3+1] - rip.y;
          const dist = Math.sqrt(dx * dx + dy * dy) + 0.0001;
          const ringDist = Math.abs(dist - ripRadius);
          if (ringDist < 0.7) {
            const f = (1 - ringDist / 0.7) * rip.str * decay / dist;
            vel[i3]   += dx * f;
            vel[i3+1] += dy * f;
          }
        }
      }

      // Per-particle spring + repel
      for (let i = 0; i < N; i++) {
        const i3 = i * 3;
        let vx = vel[i3], vy = vel[i3+1], vz = vel[i3+2];
        const px = pos[i3], py = pos[i3+1], pz = pos[i3+2];

        // Spring back to rest
        vx += (rest[i3]   - px) * SPRING;
        vy += (rest[i3+1] - py) * SPRING;
        vz += (rest[i3+2] - pz) * SPRING * 0.6;

        // Mouse repulsion (x/y plane)
        const dx   = px - mwx;
        const dy   = py - mwy;
        const dist = Math.sqrt(dx * dx + dy * dy) + 0.0001;
        if (dist < REPEL_R) {
          const f = (1 - dist / REPEL_R) * REPEL_STR;
          vx += (dx / dist) * f;
          vy += (dy / dist) * f;
        }

        // Damping
        vx *= DAMPING;
        vy *= DAMPING;
        vz *= DAMPING;

        vel[i3]   = vx;
        vel[i3+1] = vy;
        vel[i3+2] = vz;

        pos[i3]   = px + vx;
        pos[i3+1] = py + vy;
        pos[i3+2] = pz + vz;
      }

      posAttr.needsUpdate = true;
    }

    // ─────────────────────────────────────────────────────────────────────────
    //  Render loop
    // ─────────────────────────────────────────────────────────────────────────
    const TILT_MAX  = 0.16;   // max rotation in radians (~9°)
    const L_TILT    = 0.048;
    const L_SEEK    = 0.085;
    const L_RING    = 0.11;
    const L_CHROMA  = 0.10;

    function tick() {
      requestAnimationFrame(tick);

      // ── Cursor ──
      curDot.style.left = rawMouseX + 'px';
      curDot.style.top  = rawMouseY + 'px';
      cRingX = lerp(cRingX, rawMouseX, L_RING);
      cRingY = lerp(cRingY, rawMouseY, L_RING);
      curRing.style.left = cRingX + 'px';
      curRing.style.top  = cRingY + 'px';

      // ── UI opacity ──
      const p = scrollP;
      hero.style.opacity       = p < 0.12 ? 1 : Math.max(0, 1 - (p - 0.12) / 0.13);
      scrollHint.style.opacity = p < 0.03 ? '1' : '0';

      // ── Video scrub ──
      if (videoDuration > 0) {
        smoothTime = lerp(smoothTime, targetTime, L_SEEK);
        if (Math.abs(smoothTime - lastSeek) > 0.007) {
          video.currentTime = smoothTime;
          lastSeek = smoothTime;
        }
      }
      videoTex.needsUpdate = true;

      // ── 3-D tilt of video + camera nudge ──
      tiltX = lerp(tiltX, tiltTargX * TILT_MAX, L_TILT);
      tiltY = lerp(tiltY, tiltTargY * TILT_MAX, L_TILT);
      videoMesh.rotation.y =  tiltX;
      videoMesh.rotation.x = -tiltY;

      // Subtle camera parallax (much slower / smaller)
      camera.position.x = lerp(camera.position.x, tiltTargX * 0.06, 0.025);
      camera.position.y = lerp(camera.position.y, tiltTargY * 0.04, 0.025);

      // ── Particle physics ──
      updatePhysics();

      // ── Chromatic aberration ──
      chromaStr = lerp(chromaStr, chromaTarget, L_CHROMA);
      chromaPass.uniforms.uStr.value = chromaStr;

      // ── Render via composer ──
      composer.render();
    }

    tick();

    // ─────────────────────────────────────────────────────────────────────────
    //  Resize
    // ─────────────────────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      const w = W(), h = H();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      const ph = frustumHeight(camera.position.z) * 0.92;
      const pw = ph * (16 / 9);
      videoMesh.geometry.dispose();
      videoMesh.geometry = new THREE.PlaneGeometry(pw, ph);

      bloom.resolution.set(w, h);
      pMat.uniforms.uPR.value = renderer.getPixelRatio();
    });
  </script>

</body>
</html>
