<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mouse — Precision Engineered</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: auto; }

    body {
      background: #080810;
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    #scroll-spacer {
      height: 500vh;
    }

    #canvas-wrap {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      cursor: none;
    }

    #canvas-wrap canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* Ambient gradient that reacts to mouse via JS */
    #ambient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%,  rgba(110,60,255,0.14) 0%, transparent 70%),
        radial-gradient(ellipse 50% 35% at 50% 105%, rgba(0,190,255,0.10) 0%, transparent 70%);
    }

    /* Mouse-following spot light */
    #spotlight {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(160,120,255,0.07) 0%, transparent 70%);
      transition: opacity 0.4s;
      opacity: 0;
    }

    #hero {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 4;
      pointer-events: none;
      will-change: opacity;
    }

    #hero h1 {
      font-size: clamp(2.6rem, 7vw, 6.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.04;
      background: linear-gradient(130deg, #ffffff 0%, #c4b5fd 45%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #hero .sub {
      margin-top: 1.4rem;
      font-size: clamp(0.75rem, 1.5vw, 0.95rem);
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    #scroll-hint {
      position: absolute;
      bottom: 2.8rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      pointer-events: none;
      will-change: opacity;
    }

    #scroll-hint span {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
    }

    #scroll-hint .line {
      width: 1px;
      height: 44px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.35), transparent);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1;   transform: scaleY(1); }
      50%       { opacity: 0.3; transform: scaleY(0.6); }
    }

    /* Top progress bar */
    #progress {
      position: fixed;
      top: 0; left: 0;
      height: 2px;
      width: 0%;
      z-index: 200;
      background: linear-gradient(90deg, #7c3aed, #38bdf8);
      pointer-events: none;
    }

    /* Custom cursor dot */
    #cursor {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(200,180,255,0.85);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      mix-blend-mode: screen;
      transition: transform 0.15s ease, background 0.2s;
    }
    #cursor-ring {
      position: fixed;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(200,180,255,0.3);
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      mix-blend-mode: screen;
    }

    /* Below section */
    #below {
      position: relative;
      z-index: 5;
      background: #080810;
      padding: 9rem 2rem;
      text-align: center;
    }

    #below h2 {
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 1.6rem;
      letter-spacing: -0.02em;
    }

    #below p {
      max-width: 560px;
      margin: 0 auto;
      color: rgba(255,255,255,0.4);
      line-height: 1.85;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div id="progress"></div>
  <div id="cursor"></div>
  <div id="cursor-ring"></div>

  <div id="scroll-spacer">
    <div id="canvas-wrap">
      <div id="ambient"></div>
      <div id="spotlight"></div>
      <div id="hero">
        <h1>Engineered<br>for Precision</h1>
        <p class="sub">Scroll to explore</p>
      </div>
      <div id="scroll-hint">
        <span>Scroll</span>
        <div class="line"></div>
      </div>
    </div>
  </div>

  <section id="below">
    <h2>Every detail. Considered.</h2>
    <p>From the arc of the shell to the weight of the scroll wheel, every component is refined to feel like an extension of your hand.</p>
  </section>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ── DOM ───────────────────────────────────────────────────────────────────
    const wrap        = document.getElementById('canvas-wrap');
    const hero        = document.getElementById('hero');
    const scrollHint  = document.getElementById('scroll-hint');
    const progressBar = document.getElementById('progress');
    const spacer      = document.getElementById('scroll-spacer');
    const spotlight   = document.getElementById('spotlight');
    const cursorDot   = document.getElementById('cursor');
    const cursorRing  = document.getElementById('cursor-ring');

    // ── Renderer ──────────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    // Correct colour space so video colours render accurately
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    wrap.appendChild(renderer.domElement);

    // ── Scene / camera ────────────────────────────────────────────────────────
    const scene  = new THREE.Scene();
    // Perspective camera gives genuine 3-D tilt
    const fov    = 45;
    const camera = new THREE.PerspectiveCamera(fov, wrap.clientWidth / wrap.clientHeight, 0.1, 100);
    camera.position.z = 2;

    // ── Video ─────────────────────────────────────────────────────────────────
    const video = document.createElement('video');
    video.src        = 'Mouse_rotation_exploded_202604202134.mp4';
    video.muted      = true;
    video.playsInline = true;
    video.preload    = 'auto';
    video.load();

    const videoTex = new THREE.VideoTexture(video);
    videoTex.colorSpace  = THREE.SRGBColorSpace;   // fix washed-out / gamma-wrong colours
    videoTex.minFilter   = THREE.LinearFilter;
    videoTex.magFilter   = THREE.LinearFilter;
    videoTex.generateMipmaps = false;

    // ── Shader — custom GLSL for colour grading + vignette ───────────────────
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTex:      { value: videoTex },
        uVignette: { value: 0.55 },  // vignette strength
        uSaturation: { value: 1.18 }, // slight saturation boost
        uExposure:  { value: 1.05 },
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D uTex;
        uniform float uVignette;
        uniform float uSaturation;
        uniform float uExposure;
        varying vec2 vUv;

        vec3 saturation(vec3 rgb, float adj) {
          float luma = dot(rgb, vec3(0.2126, 0.7152, 0.0722));
          return mix(vec3(luma), rgb, adj);
        }

        void main() {
          vec4 col = texture2D(uTex, vUv);

          // Exposure
          col.rgb *= uExposure;

          // Saturation
          col.rgb = saturation(col.rgb, uSaturation);

          // Vignette
          vec2 uv2 = vUv * 2.0 - 1.0;
          float vign = 1.0 - uVignette * dot(uv2, uv2);
          col.rgb *= clamp(vign, 0.0, 1.0);

          gl_FragColor = vec4(col.rgb, col.a);
        }
      `,
      transparent: true,
    });

    // ── Mesh sized to fill the perspective camera view ────────────────────────
    // At z=0 with camera at z=2 and fov=45: visible height = 2 * tan(fov/2) * 2
    const planeH = 2 * Math.tan((fov / 2) * Math.PI / 180) * 2;
    const planeW = planeH * (wrap.clientWidth / wrap.clientHeight);
    const geo    = new THREE.PlaneGeometry(planeW, planeH);
    const mesh   = new THREE.Mesh(geo, mat);
    scene.add(mesh);

    // ── Smooth state ──────────────────────────────────────────────────────────
    let duration      = 0;
    let targetTime    = 0;
    let smoothTime    = 0;       // what we actually seek to
    let lastSeekTime  = -1;

    // Mouse-driven tilt (normalised -1..1)
    let mouseNX = 0, mouseNY = 0;   // raw target
    let tiltX   = 0, tiltY   = 0;  // smoothed

    // Cursor DOM positions (for smooth cursor ring)
    let cursorX = 0, cursorY = 0;
    let ringX   = 0, ringY   = 0;

    video.addEventListener('loadedmetadata', () => { duration = video.duration; });

    // ── Scroll scrubbing ──────────────────────────────────────────────────────
    let scrollProgress = 0;

    window.addEventListener('scroll', () => {
      const maxScroll = spacer.offsetHeight - window.innerHeight;
      scrollProgress = Math.max(0, Math.min(1, window.scrollY / maxScroll));
      targetTime = scrollProgress * duration;
      progressBar.style.width = (scrollProgress * 100) + '%';
    }, { passive: true });

    // ── Mouse tracking ────────────────────────────────────────────────────────
    let mouseInside = false;

    wrap.addEventListener('mousemove', (e) => {
      const r = wrap.getBoundingClientRect();
      const x = (e.clientX - r.left)  / r.width;   // 0..1
      const y = (e.clientY - r.top)   / r.height;  // 0..1
      mouseNX =  (x - 0.5) * 2;   // -1..1, positive = right
      mouseNY = -(y - 0.5) * 2;   // -1..1, positive = up
      cursorX  = e.clientX;
      cursorY  = e.clientY;
      mouseInside = true;
      spotlight.style.opacity = '1';
      spotlight.style.left    = e.clientX + 'px';
      spotlight.style.top     = e.clientY + 'px';
    });

    wrap.addEventListener('mouseleave', () => {
      mouseInside = false;
      mouseNX = 0;
      mouseNY = 0;
      spotlight.style.opacity = '0';
    });

    document.addEventListener('mousemove', (e) => {
      cursorX = e.clientX;
      cursorY = e.clientY;
    });

    // ── Render loop ───────────────────────────────────────────────────────────
    const TILT_STRENGTH = 0.18;  // max rotation in radians (~10°)
    const LERP_TILT     = 0.055; // tilt smoothing (lower = lazier)
    const LERP_SEEK     = 0.10;  // video seek smoothing

    function lerp(a, b, t) { return a + (b - a) * t; }

    function tick() {
      requestAnimationFrame(tick);

      // Smooth cursor ring
      ringX = lerp(ringX, cursorX, 0.12);
      ringY = lerp(ringY, cursorY, 0.12);
      cursorDot.style.left  = cursorX + 'px';
      cursorDot.style.top   = cursorY  + 'px';
      cursorRing.style.left = ringX + 'px';
      cursorRing.style.top  = ringY + 'px';

      // Smooth tilt
      tiltX = lerp(tiltX, mouseNX * TILT_STRENGTH, LERP_TILT);
      tiltY = lerp(tiltY, mouseNY * TILT_STRENGTH, LERP_TILT);

      // Apply tilt to mesh (not camera, keeps UV sampling clean)
      mesh.rotation.y =  tiltX;
      mesh.rotation.x = -tiltY;

      // Hero text fade
      const p = scrollProgress;
      const heroOpacity = p < 0.12 ? 1 : Math.max(0, 1 - (p - 0.12) / 0.13);
      hero.style.opacity      = heroOpacity;
      scrollHint.style.opacity = p < 0.03 ? '1' : '0';

      // Smooth video scrubbing
      if (duration > 0) {
        smoothTime = lerp(smoothTime, targetTime, LERP_SEEK);
        if (Math.abs(smoothTime - lastSeekTime) > 0.008) {
          video.currentTime = smoothTime;
          lastSeekTime = smoothTime;
        }
      }

      videoTex.needsUpdate = true;
      renderer.render(scene, camera);
    }

    tick();

    // ── Resize ────────────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      const w = wrap.clientWidth, h = wrap.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      // Refit plane to camera frustum
      const ph = 2 * Math.tan((fov / 2) * Math.PI / 180) * 2;
      const pw = ph * (w / h);
      mesh.geometry.dispose();
      mesh.geometry = new THREE.PlaneGeometry(pw, ph);
    });
  </script>

</body>
</html>
